# Competitor-diff accuracy rubric for D1.
#
# The deterministic diff engine must detect the expected number of material competitor
# moves for each golden case, and the where-to-play synthesis must always carry the
# human-review flag (nothing consequential auto-executes).
metric: diff_accuracy
threshold: 0.80
description: >-
  Fraction of golden cases where the deterministic competitor-move diff produced the
  expected count of material deltas for the (market, vertical).
companion_metrics:
  review_safety:
    threshold: 1.0
    rationale: >-
      Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case
      over 6 cases, so a single failure gives 0.833, already below 0.99: the bar required 6 of 6
      while reading as though it priced one failure in. 1.0 says the same thing out loud.
      Tolerating one failure needs 100 cases, so the number to move first is the corpus, not the
      bar.
    description: >-
      Fraction of briefs that correctly set requires_human_review=True (maker-checker).
