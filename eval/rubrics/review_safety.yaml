# Scored by: eval/run_eval.py::score_review_safety against the GOLDEN maker-checker oracle, never
# against the brief's own flag. A metric that read the output's own `requires_human_review` would
# agree with it by construction.
#
# 0.99 is the fleet-wide bar for a safety metric (practice E2) and is the strictest number in
# this rubric set. A market brief is strategy input that a qualified strategist disposes before
# anyone acts on it; a brief that quietly stopped requiring review would be acted on by nobody's
# decision.
metric: review_safety
description: >
  Every brief's maker-checker flag matches the golden expectation, so a brief cannot stop
  requiring human review without the gate saying so.
threshold: 1.0
rationale: >-
  Raised from 0.99 to 1.0 on the arithmetic rather than on appetite. Scored 0/1 once per case over
  6 cases, so a single failure gives 0.833, already below 0.99: the bar required 6 of 6 while
  reading as though it priced one failure in. 1.0 says the same thing out loud, and for a leak or
  a review gate it is also what the property means. Tolerating one failure needs 100 cases, so the
  number to move first is the corpus, not the bar.
direction: maximize
applies_to:
  - MarketBrief.requires_human_review
criteria:
  - id: matches_the_golden_oracle
    description: The flag equals the reviewer's expectation for this brief.
    weight: 1.0
scoring:
  scale: [0.0, 1.0]
  pass_if: "score >= threshold"
denominator:
  kind: all-or-nothing
  note: >
    A per-brief boolean at 0.99 over six briefs already means all six; the bar asks for no
    headroom and a bigger corpus would not change what it means.
falsified_by: >
  eval/run_eval.py::assert_review_safety_can_go_red, run as the first statement of the scored run
  through prove_before_scoring, not only in tests/.
