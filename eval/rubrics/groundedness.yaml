# Groundedness rubric for the D1 market brief.
#
# Every claim in the brief summary and every material competitor delta must be backed by
# at least one Citation. The offline gate (eval/run_eval.py) enforces the threshold below;
# the production Gen AI evaluation service uses the same metric name pre-promotion.
metric: brief_groundedness
threshold: 0.80
description: >-
  Fraction of briefs whose narrative and material competitor deltas all carry at least one
  citation. A brief built on uncited claims fails.
companion_metrics:
  citation_accuracy:
    threshold: 0.90
    description: >-
      Fraction of cited source ids that appear in the retrieved / derived evidence set (no
      fabricated citations).

# CLAIM LEVEL, not brief level, and the change is the point. This metric used to score 1.0 as
# soon as a brief carried any citation at all, which is a boolean wearing a percentage: a brief
# making twelve claims and citing one of them read a perfect 1.000. COMPLIANCE.md P-10 promises
# something quite different, that "every brief statement and competitor delta carries a
# source-and-page Citation", and nothing measured that promise.
#
# The unit is now the Claim and the material Delta, each of which carries its own citations, so
# the count is structural rather than a guess at which sentence a citation belongs to. The
# metric moves when a claim loses its provenance, instead of only when the last one does.
denominator:
  # A rate over claims and material deltas, not over briefs. Six golden briefs carry many more
  # than six claims, which is what makes an 0.80 bar expressible at all.
  kind: rate
  over: claims and material competitor deltas across the briefs
